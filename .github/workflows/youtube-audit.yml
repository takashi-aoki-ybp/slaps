name: YouTube availability audit

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      audit_all:
        description: Audit all currently published videos
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: youtube-availability-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Use the reviewed audit implementation, not the old application on main.
      # Catalog data below comes from production on every run, including community submissions.
      - uses: actions/checkout@v4
        with:
          ref: f242996127fbdc6d8ff2513dfbd5c2618d77c39b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the current public catalog
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch('https://slaps.tokyo/api/songs', { signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`Catalog HTTP ${response.status}`);
            const songs = await response.json();
            if (!Array.isArray(songs) || !songs.length || songs.some(s => !s || !/^[A-Za-z0-9_-]{11}$/.test(s.youtube_id) || typeof s.name !== 'string')) throw new Error('Invalid or empty public catalog');
            if (new Set(songs.map(s => s.youtube_id)).size !== songs.length) throw new Error('Duplicate catalog IDs');
            songs.sort((a, b) => a.youtube_id.localeCompare(b.youtube_id));
            fs.mkdirSync('outputs', { recursive: true });
            fs.writeFileSync('data/songs.json', JSON.stringify(songs));
            fs.writeFileSync('outputs/catalog-source.json', JSON.stringify({ source: response.url, fetched_at: new Date().toISOString(), count: songs.length }));
            console.log(`Current public catalog: ${songs.length} unique tracks`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Check YouTube availability
        env:
          AUDIT_ALL: ${{ inputs.audit_all }}
        run: |
          if [ "$AUDIT_ALL" = "true" ]; then
            node scripts/audit-youtube.js --all
          else
            node scripts/audit-youtube.js
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-audit-${{ github.run_id }}
          path: |
            outputs/youtube-audit.json
            outputs/catalog-source.json
          if-no-files-found: error
